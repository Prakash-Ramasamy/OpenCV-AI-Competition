services:
  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    environment:
      AUDITVISION_DOCUMENTS_DIR: /app/data/documents
    volumes:
      - auditvision-documents:/app/data/documents
    networks:
      - auditvision-internal

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - auditvision-internal

networks:
  auditvision-internal:
    driver: bridge

volumes:
  auditvision-documents:
